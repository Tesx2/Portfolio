<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Portfolio Admin</title>
<style>
:root{--p:#2F495A;--a:#00C2A8;--g:#27AE60;--bg:#F5F7F8;--line:#e2e8ec;--mut:#64717a;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:#222}
header{background:var(--p);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;position:sticky;top:0;z-index:5}
header b{font:700 18px Montserrat,sans-serif}header span{opacity:.75;font-size:13px;margin-right:14px}
main{max-width:1100px;margin:0 auto;padding:28px 20px}
h2{font:700 22px Montserrat,sans-serif;color:var(--p);margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
button,.btn{font:600 14px Inter,sans-serif;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--p);color:#fff}
button.ghost{background:#fff;color:var(--p);border:1px solid var(--line)}button.ok{background:var(--g)}button.bad{background:var(--bad)}button:disabled{opacity:.5;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.15s}.card:hover{box-shadow:0 8px 22px rgba(47,73,90,.12);transform:translateY(-2px)}
.card h3{margin:0 0 4px;color:var(--p)}.card small{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e8f7f4;color:#0a8a78;margin-left:6px}.tag.warn{background:#fdf0e0;color:#a8620a}
dialog{border:0;border-radius:14px;padding:0;width:min(760px,94vw);max-height:92vh;box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(20,32,40,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.dh h3{margin:0;color:var(--p)}
.db{padding:20px 22px}.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px;color:var(--p)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cdd6db;border-radius:8px;font:inherit;background:#fff}textarea{min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.list{border:1px solid var(--line);border-radius:10px;margin-top:8px}.li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px}.li:last-child{border:0}
.drop{border:2px dashed #b8c6cd;border-radius:10px;padding:18px;text-align:center;color:var(--mut);margin-top:8px}.drop.on{border-color:var(--a);background:#effbf9}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:11px 20px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99}#toast.show{opacity:1}#toast.err{background:var(--bad)}
.sw{display:flex;align-items:center;gap:8px;margin-top:14px}.sw input{width:auto}
#tabs{display:flex;gap:6px;flex-wrap:wrap}#tabs button{background:transparent;border:1px solid rgba(255,255,255,.35);padding:6px 12px}#tabs button.on{background:var(--a);border-color:var(--a)}
[data-i]{cursor:grab}h3.sec{margin:22px 0 4px;color:var(--p)}
.app{display:flex;min-height:100vh}.content{flex:1;min-width:0}
#side{width:252px;flex:none;background:#1b252c;color:#c3cfd6;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
#side .brand{font:700 17px Montserrat,sans-serif;color:#fff;padding:8px 12px 18px;display:flex;align-items:center;gap:10px}
#side .brand i{width:30px;height:30px;border-radius:8px;background:var(--a);display:grid;place-items:center;font-style:normal;color:#06332d}
#side .nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
#side button,#side a{background:transparent;color:#c3cfd6;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font:500 14.5px Inter,sans-serif;width:100%;text-decoration:none;border:0}
#side button:hover,#side a:hover{background:#26343d}#side .nav button.on{background:#2d3f4a;color:#fff}
#side em{margin-left:auto;font-style:normal;font-size:11px;background:#e5a13a;color:#2a1a00;border-radius:999px;padding:1px 8px;font-weight:700}
#side .sp{flex:1}#side .foot{border-top:1px solid #2c3b45;padding-top:10px;display:flex;flex-direction:column;gap:2px}#side small{padding:2px 12px 6px;color:#7d8f9a}
.top{display:none;align-items:center;gap:12px;padding:10px 16px;background:#1b252c;color:#fff;position:sticky;top:0;z-index:15}.top button{padding:6px 12px}
@media(max-width:860px){#side{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.4)}#side.open{transform:none}.top{display:flex}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s}.stat:hover{box-shadow:0 6px 18px rgba(47,73,90,.12)}
.stat b{display:block;font:700 26px Montserrat,sans-serif;color:var(--p)}.stat span{color:var(--mut);font-size:13px}
button,.btn{white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px}button.sm{padding:4px 10px;min-height:0;font-size:12px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.mut{color:var(--mut)}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#e8edf0;flex:none;display:block}
.pn{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.chip{background:#fff;color:var(--p);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:0}.chip.on{background:var(--p);color:#fff}
.is{display:flex;gap:14px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)}.is:last-child{border:0}.is .b{flex:1;min-width:0}.is .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sev{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-right:6px}.sev.hi{background:#fde8e6;color:#b3261e}.sev.mid{background:#fdf0e0;color:#a8620a}.sev.lo{background:#e8f0f6;color:#2F495A}
.alts{display:grid;gap:10px;margin-top:10px}.alt{display:flex;gap:10px;align-items:center}.alt .th{width:44px;height:44px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}.mi{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.mi img,.mi .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block}.mi .ph{display:grid;place-items:center;background:#e8edf0;color:var(--mut);font-weight:700}
.mi input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px}.mi .x{position:absolute;top:6px;right:6px;padding:2px 8px;min-height:0}
.mi .cv{position:absolute;top:6px;left:6px;background:var(--a);color:#06332d;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.mv{display:flex;gap:4px}.mi .mv{position:absolute;left:6px;bottom:44px}
.sk{height:64px;border-radius:10px;background:linear-gradient(90deg,#e9eef1 25%,#f4f7f8 50%,#e9eef1 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
#toast.show{pointer-events:auto}#toast button{margin-left:12px;background:#fff;color:var(--p);padding:4px 12px;min-height:0}
#pal{position:fixed;inset:0;background:rgba(20,32,40,.55);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50}#pal.on{display:flex}
.pb{background:#fff;width:min(560px,92vw);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}.pb input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:16px}
.pi{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;cursor:pointer}.pi.on,.pi:hover{background:#eef4f6}.pi small{color:var(--mut)}
#side kbd{margin-left:auto;font-size:11px;background:#26343d;border-radius:5px;padding:1px 6px}
@media(max-width:700px){dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}main{padding:18px 14px}.bar h2{font-size:19px}.li{flex-wrap:wrap}.is{flex-wrap:wrap}.is .acts{width:100%;justify-content:flex-start}#toast{width:90vw;text-align:center}}
</style></head><body>
<div class="app"><aside id="side"><div class="brand"><i>◆</i>Portfolio Admin</div>
<button id="sb"><i data-ic="search"></i>Search<kbd>Ctrl K</kbd></button><nav class="nav" style="margin-top:6px"><button data-v="dash" class="on"><i data-ic="dash"></i>Dashboard</button><button data-v="clients"><i data-ic="clients"></i>Clients</button><button data-v="projects"><i data-ic="projects"></i>Projects</button><button data-v="cats"><i data-ic="cats"></i>Categories</button><button data-v="site"><i data-ic="site"></i>Site settings</button><button data-v="health"><i data-ic="health"></i>Health<em id="hb" hidden></em></button><button data-v="data"><i data-ic="data"></i>Backups &amp; trash</button></nav>
<div class="sp"></div><div class="foot"><a id="vs" target="_blank" rel="noopener"><i data-ic="ext"></i>View live site</a><small id="ver"></small><button id="logout"><i data-ic="out"></i>Log out</button></div></aside>
<div class="content"><div class="top"><button class="ghost" id="menu"><i data-ic="menu"></i></button><b>Portfolio Admin</b></div>
<main id="v-clients"><div class="bar"><h2>Clients</h2><button class="ok" id="addClient">+ Add client</button></div><div class="grid" id="clients"></div></main><main id="v-x" hidden></main></div></div>
<div id="pal"><div class="pb"><input id="pq" placeholder="Search pages, projects, clients…" autocomplete="off"><div id="pr"></div></div></div><dialog id="d1"></dialog><dialog id="d2"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item', rid=()=>Math.random().toString(36).slice(2,8);
let db, saving=false, cur=null;
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='show'+(e?' err':'');setTimeout(()=>t.className='',2800)};
const logout=async()=>{try{await fetch('/api/auth/sign-out',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){}location.href='/login'};
$('#logout').onclick=logout;
// Auto log-out after 30 minutes without activity (Cloudflare Access also ends the session after its own limit)
let idle;const bump=()=>{clearTimeout(idle);idle=setTimeout(logout,30*60e3)};['click','keydown','mousemove','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));bump();
async function api(path,o={}){
  const r=await fetch(path,{...o,headers:{'X-Admin':'1',...(o.headers||{})}});
  if(r.status===401){toast('Session ended. Please sign in again…',1);setTimeout(()=>location.href='/login',1200);throw new Error('401')}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
let saved=0;const ago=()=>{const m=Math.round((Date.now()-saved)/60000);return m<1?'just now':m+' min ago'};
const setSt=(t,e)=>{const v=$('#ver');v.textContent=t||(saved?'Published '+ago():'Version '+(db.rev||0));v.style.color=e?'#ff8a80':''};setInterval(()=>db&&setSt(),30000);
async function save(){setSt('Saving…');let d;try{d=await api('/api/db',{method:'PUT',body:JSON.stringify(db)})}catch(e){setSt('Not saved',1);throw e}db.rev=d.rev;saved=Date.now();toast('Saved and published');render();badge();if(V!=='clients')views[V]()}
const clientOf=s=>db.clients.find(c=>c.slug===s), projs=c=>db.projects.filter(p=>p.client===c);
function render(){
  $('#clients').innerHTML=db.clients.map(c=>`<div class="card" data-c="${esc(c.slug)}"><h3>${esc(c.name)}${c.archived?'<span class="tag warn">Archived</span>':''}${c.showName===false?'<span class="tag warn">Name hidden</span>':''}</h3><small>${projs(c.slug).length} project(s)</small></div>`).join('')||'<p style="color:var(--mut)">No clients yet. Add your first one.</p>';
  document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>clientDlg(e.dataset.c))}
function dlg(id,title,body,foot){const d=$(id);d.innerHTML=`<div class="dh"><h3>${title}</h3><button class="ghost" data-x>Close</button></div><div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:''}`;d.querySelector('[data-x]').onclick=()=>d.close();if(!d.open)d.showModal();return d}
$('#addClient').onclick=()=>clientDlg(null);
function clientDlg(s){
  const c=s?clientOf(s):{name:'',about:'',showName:true,publicLabel:''}; cur=s;
  const d=dlg('#d1',s?esc(c.name):'New client',`
   <label>Client name</label><input id="cn" value="${esc(c.name)}">
   <label>Short intro (shown on the client page)</label><textarea id="ca">${esc(c.about)}</textarea>
   <div class="sw"><input type="checkbox" id="cs" ${c.showName!==false?'checked':''}><span>Show this client's name publicly</span></div>
   <label>Label to show when the name is hidden</label><input id="cl" value="${esc(c.publicLabel||'')}" placeholder="e.g. NGO / Humanitarian">
   ${s?`<label>Projects</label><div class="list">${projs(s).map(p=>`<div class="li"><span><b>${esc(p.title)}</b> <small>${esc(p.subcategory||p.category)}</small>${p.status==='draft'?'<span class="tag warn">Draft</span>':''}</span><span><button class="ghost" data-e="${esc(p.slug)}">Edit</button> <button class="bad" data-d="${esc(p.slug)}">Delete</button></span></div>`).join('')||'<div class="li">No projects yet</div>'}</div><p><button class="ok" id="np">+ Add project</button></p>`:''}`,
   `${s?`<button class="ghost" id="arch">${c.archived?'Restore':'Archive'}</button><button class="bad" id="delc">Delete client</button>`:''}<button class="ok" id="sc">Save client</button>`);
  $('#sc').onclick=async()=>{const name=$('#cn').value.trim();if(!name)return toast('Enter a client name',1);
    const o={...c,name,about:$('#ca').value.trim(),showName:$('#cs').checked,publicLabel:$('#cl').value.trim()};
    if(!s){o.slug=slug(name);if(clientOf(o.slug))o.slug+='-'+rid();db.clients.push(o)}else Object.assign(c,o);
    try{await save();d.close()}catch(e){toast(e.message,1)}};
  if(s){$('#np').onclick=()=>projDlg(null);
    d.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>projDlg(b.dataset.e));
    d.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delProj(b.dataset.d));
    $('#arch').onclick=async()=>{c.archived=!c.archived;try{await save();d.close()}catch(e){toast(e.message,1)}};
    $('#delc').onclick=async()=>{if(prompt(`This deletes "${c.name}" and all ${projs(s).length} project(s) and their files.\nType the client name to confirm:`)!==c.name)return;
      try{for(const p of projs(s))await trashFiles(p);db.projects=db.projects.filter(p=>p.client!==s);db.clients=db.clients.filter(x=>x.slug!==s);await save();d.close()}catch(e){toast(e.message,1)}}}}
const keysOf=p=>{const k=[p.cover];(p.media||[]).forEach(m=>{k.push(m.src,m.poster,...(m.srcset||[]).map(x=>x.src),...(m.pages||[]))});return k.filter(Boolean).filter(x=>/^clients\//.test(x))};
const trashFiles=p=>api('/api/trash',{method:'POST',body:JSON.stringify({keys:keysOf(p)})});
async function delProj(s){const p=db.projects.find(x=>x.slug===s&&x.client===cur);if(!p||!confirm(`Delete "${p.title}" and its files? They are kept in trash for 30 days.`))return;
  try{await trashFiles(p);db.projects=db.projects.filter(x=>x!==p);await save();clientDlg(cur)}catch(e){toast(e.message,1)}}
const tax=()=>db.categories||(db.categories=[]);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const ratioOf=(w,h)=>{const P=[[16,9],[9,16],[1,1],[4,5],[5,4],[3,4],[4,3],[21,9]];let best=null,bd=9;for(const[a,b]of P){const dd=Math.abs(Math.log((w/h)/(a/b)));if(dd<bd){bd=dd;best=[a,b]}}
  if(bd<.06)return best.join(':');const g=gcd(w,h),a=w/g,b=h/g;return a<=50&&b<=50?a+':'+b:Math.round(w/h*100)/100+':1'};
// Reads a video's real size and grabs a frame for its thumbnail
const videoMeta=f=>new Promise(res=>{const v=document.createElement('video'),u=URL.createObjectURL(f);let done=false,dims=null;
  const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);res(r)};
  v.muted=true;v.playsInline=true;v.preload='metadata';v.src=u;
  v.onloadedmetadata=()=>{const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return fin(null);dims={w,h,poster:null};v.currentTime=Math.min(1,(v.duration||1)*.1)};
  v.onseeked=()=>{const w=v.videoWidth,h=v.videoHeight,sc=Math.min(1,960/w),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    try{c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>fin({w,h,poster:b}),'image/webp',.85)}catch(e){fin(dims)}};
  v.onerror=()=>fin(dims);setTimeout(()=>fin(dims),15000)});
function projDlg(s){
  const c=clientOf(cur), p=s?JSON.parse(JSON.stringify(db.projects.find(x=>x.slug===s&&x.client===cur))):{title:'',category:'',subcategory:'',year:String(new Date().getFullYear()),summary:'',status:'published',media:[],deliverables:[],tools:[],featured:false,folder:''};
  const opts=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  const d=dlg('#d2',s?'Edit project':'New project for '+esc(c.name),`
   <label>Title</label><input id="pt" value="${esc(p.title)}">
   <div class="row"><div><label>Category</label><select id="pc"></select></div><div><label>Type (subcategory)</label><select id="ps"></select></div></div>
   <div class="row"><div><label>Year</label><input id="py" value="${esc(p.year)}"></div><div><label>Status</label><select id="pst"><option value="published" ${p.status!=='draft'?'selected':''}>Published</option><option value="draft" ${p.status==='draft'?'selected':''}>Draft (hidden)</option></select></div></div>
   <label>Summary</label><textarea id="pm">${esc(p.summary)}</textarea>
   <div class="row"><div><label>Sizes / deliverables (comma separated)</label><input id="pd" value="${esc((p.deliverables||[]).join(', '))}"></div><div><label>Tools (comma separated)</label><input id="pl" value="${esc((p.tools||[]).join(', '))}"></div></div>
   <div class="sw"><input type="checkbox" id="pf" ${p.featured?'checked':''}><span>Feature on the home page</span></div>
   <label>Media</label><div class="list" id="ml"></div>
   <div class="drop" id="dz">Drop images, videos (MP4/WebM up to 100 MB) or PDFs here, or <u style="cursor:pointer" id="pick">choose files</u><input type="file" id="fi" multiple accept="image/*,video/mp4,video/webm,application/pdf" hidden>
     <div class="row" style="margin-top:10px"><select id="vr"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select><span style="text-align:left;align-self:center;font-size:13px">Video shape and thumbnail are detected automatically (this is only a fallback)</span></div></div>
   <div class="row" style="margin-top:10px"><input id="eu" placeholder="Or paste a YouTube, Vimeo, Instagram, TikTok or Facebook link"><button class="ghost" id="ea">Add link</button></div>`,
   `<button class="ghost" id="pcx">Cancel</button><button class="ok" id="psv">Save project</button>`);
  const origKeys=new Set(s?keysOf(p):[]),up=new Set();let saved=false;
  const trash=keys=>keys.length?api('/api/trash',{method:'POST',body:JSON.stringify({keys})}).catch(()=>{}):0;
  d.addEventListener('close',()=>{if(!saved)trash([...up].filter(k=>!origKeys.has(k)))},{once:true}); // abandoned uploads
  const catSel=()=>{$('#pc').innerHTML='<option value="">Choose…</option>'+opts(tax().map(t=>t.name),p.category)+'<option value="__n">+ New category…</option>';fillSub()};
  const fillSub=()=>{const t=tax().find(t=>t.name===p.category);$('#ps').innerHTML='<option value="">None</option>'+opts(t?.subcategories||[],p.subcategory)+(p.category?'<option value="__n">+ New type…</option>':'')};
  catSel();
  $('#pc').onchange=e=>{let v=e.target.value;if(v==='__n'){v=(prompt('New category name')||'').trim();if(v&&!tax().some(t=>t.name===v))tax().push({name:v,subcategories:[]})}p.category=v;p.subcategory='';catSel()};

  <div class="list">${L.map(x=>{const t=x.m?thumb(x.m):x.p.cover?MEDIA+'/'+x.p.cover:'';return `<div class="is"><img class="th" src="${esc(t)}" alt="" onerror="this.style.visibility='hidden'"><div class="b"><span class="sev ${cl[x.s]}">${sv[x.s]}</span> ${x.h}<br><small class="mut">${esc(x.p.title)} · ${esc(cname(x.p))}</small><br><small class="mut">${x.d}</small>${x.body||''}</div><div class="acts">${x.b}</div></div>`}).join('')||'<div class="li">All good. Nothing to fix ✓</div>'}</div>`;
  document.querySelectorAll('#v-x [data-x]').forEach(b=>b.onclick=acts[+b.dataset.x]);
  document.querySelectorAll('#v-x [data-f]').forEach(b=>b.onclick=()=>{hf=b.dataset.f;health()})}
// ---- Ctrl+K quick search ----
const pal=$('#pal'),pq2=$('#pq'),pr=$('#pr');let sel=0,res=[];
const items=()=>[...[['dash','Dashboard'],['clients','Clients'],['projects','Projects'],['cats','Categories'],['site','Site settings'],['health','Health check'],['data','Backups & trash']].map(([v,t])=>({t,s:'Page',f:()=>show(v)})),...db.projects.map(p=>({t:p.title,s:'Project · '+cname(p),f:()=>{cur=p.client;projDlg(p.slug)}})),...db.clients.map(c=>({t:c.name,s:'Client',f:()=>clientDlg(c.slug)}))];
const pdraw=()=>{const q=pq2.value.toLowerCase();res=items().filter(x=>(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,8);sel=Math.max(0,Math.min(sel,res.length-1));pr.innerHTML=res.map((x,i)=>`<div class="pi${i===sel?' on':''}" data-k="${i}"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div>`).join('')||'<div class="pi">No results</div>';pr.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>pgo(+e.dataset.k))};
const closeP=()=>pal.classList.remove('on'),openP=()=>{if(!db)return;$('#side').classList.remove('open');pal.classList.add('on');pq2.value='';sel=0;pdraw();pq2.focus()},pgo=i=>{if(res[i]){closeP();res[i].f()}};
pq2.oninput=()=>{sel=0;pdraw()};pal.onclick=e=>{if(e.target===pal)closeP()};$('#sb').onclick=openP;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openP()}else if(pal.classList.contains('on')){if(e.key==='Escape')closeP();else if(e.key==='ArrowDown'){sel=Math.min(sel+1,res.length-1);pdraw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);pdraw();e.preventDefault()}else if(e.key==='Enter')pgo(sel)}});
async function data(){
  $('#v-x').innerHTML='<div class="bar"><h2>Backups &amp; trash</h2></div><h3 class="sec">Saved versions (last 30)</h3><div class="list" id="bk"></div><h3 class="sec">Deleted files (kept 30 days)</h3><div class="list" id="tr"></div>';
  try{const[b,t]=await Promise.all([api('/api/backups'),api('/api/trash')]);
    $('#bk').innerHTML=[...b.items].reverse().map(x=>`<div class="li"><span>Version ${x.rev} <small>${new Date(x.uploaded).toLocaleString()}</small></span><button class="ghost" data-b="${esc(x.key)}">Restore</button></div>`).join('')||'<div class="li">None yet. A copy is kept on every save.</div>';
    $('#tr').innerHTML=t.items.map(x=>`<div class="li"><span>${esc(x.file)} <small>${new Date(x.ts).toLocaleString()}</small></span><button class="ghost" data-t="${esc(x.key)}">Restore file</button></div>`).join('')||'<div class="li">Trash is empty</div>';
    document.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{if(!confirm('Replace everything with this version? The current one is backed up first.'))return;
      try{const r=await api('/api/backup?key='+encodeURIComponent(b.dataset.b));r.rev=db.rev;db=r;await save()}catch(e){toast(e.message,1)}});
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{try{await api('/api/restore',{method:'POST',body:JSON.stringify({key:b.dataset.t})});toast('File restored');data()}catch(e){toast(e.message,1)}})
  }catch(e){toast(e.message,1)}}
api('/api/db').then(d=>{db=d;render();show('dash')}).catch(e=>toast('Could not load: '+e.message,1));
</script></body></html>
